[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scpi-replay"
version = "0.1.1"
description = "Record SCPI raw-socket traffic through a proxy into JSONL cassettes and replay them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ralf Steinert"}]
requires-python = ">=3.10"
dependencies = []
keywords = ["scpi", "record", "replay", "cassette", "proxy", "test automation", "pyvisa", "instrument", "lab"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/steitec/scpi-replay"
Repository = "https://github.com/steitec/scpi-replay"
Changelog = "https://github.com/steitec/scpi-replay/blob/main/CHANGELOG.md"
Issues = "https://github.com/steitec/scpi-replay/issues"

[project.optional-dependencies]
toml = ["tomli>=2; python_version < '3.11'"]
dev = [
    "pytest>=8",
    "scpi-sim>=0.5",
    "pyvisa>=1.13",
    "pyvisa-py>=0.7",
    "build>=1.2",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
scpi-replay = "scpi_replay.cli:main"

[project.entry-points.pytest11]
scpi_replay = "scpi_replay.pytest_plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
